<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Innovation Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1220;--mute:#64748b;--line:#e6e8f0;--bg:#f5f6fb;
    --primary:#4338ca;--primary-2:#7c3aed;
    --success:#059669;--warn:#d97706;--danger:#e11d48;--info:#0284c7;
  }
  *{box-sizing:border-box}
  html,body{
    background:
      radial-gradient(1200px 600px at 90% -10%,rgba(124,58,237,.10),transparent 60%),
      radial-gradient(900px 500px at -10% 10%,rgba(67,56,202,.10),transparent 60%),
      var(--bg);
    color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;min-height:100vh;
  }
  .display{font-family:'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;}
  .card{background:#fff;border:1px solid #edeef5;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 26px -14px rgba(15,23,42,.08);}
  .card-pad{padding:18px 20px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4;}
  .chip-gray{background:#f1f3f9;color:#334155;}
  .chip-green{background:#d1fae5;color:#065f46;}
  .chip-amber{background:#fef3c7;color:#92400e;}
  .chip-red{background:#ffe4e6;color:#9f1239;}
  .chip-blue{background:#dbeafe;color:#1e40af;}
  .chip-violet{background:#ede9fe;color:#5b21b6;}
  .chip-info{background:#e0f2fe;color:#075985;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:filter .15s;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 14px -6px rgba(67,56,202,.55);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:#fff;border-color:#e6e8f0;color:#1e293b;}
  .btn-ghost:hover{background:#f8fafc;border-color:#cdd2e1;}
  .btn-danger{background:#fff1f2;color:#9f1239;border-color:#fecdd3;}
  .btn-danger:hover{background:#ffe4e6;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
  .input,.select,textarea{width:100%;border:1px solid #e2e5ee;border-radius:10px;padding:9px 12px;font-size:13px;background:#fff;color:#0b1220;}
  .input:focus,.select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(67,56,202,.10);}
  .lbl{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block;}
  table{width:100%;border-collapse:separate;border-spacing:0;}
  th{font-size:10.5px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:11px 14px;border-bottom:1px solid #ecedf4;background:#f7f8fc;}
  td{padding:11px 14px;border-bottom:1px solid #f3f4fa;font-size:13px;vertical-align:top;color:#1e293b;}
  tr:hover td{background:#fafbff;}
  .seg{display:inline-flex;background:#f1f3f9;border-radius:12px;padding:4px;gap:2px;}
  .seg button{padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:#475569;background:transparent;border:none;cursor:pointer;}
  .seg button.on{background:#fff;color:#0b1220;box-shadow:0 1px 3px rgba(15,23,42,.10);}
  .empty{text-align:center;padding:34px;color:#94a3b8;font-size:13px;}
  .sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#0b1220;}
  .modal-bg{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow-y:auto;}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:720px;padding:26px 28px;box-shadow:0 30px 80px rgba(11,18,32,.35);}
  .modal.wide{max-width:min(1280px,96vw);}
  .toast{position:fixed;bottom:24px;right:24px;background:#0b1220;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:100;box-shadow:0 12px 30px rgba(11,18,32,.35);}
  .overdue{color:#e11d48;font-weight:700;}
  .link{color:var(--primary);font-weight:600;cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
  .scroll-x{overflow-x:auto;}
  /* page header */
  .page-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:18px 22px;border-radius:18px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#1e1b4b 0%,#4338ca 45%,#a855f7 100%);
    color:#fff;box-shadow:0 18px 40px -22px rgba(67,56,202,.55);margin-bottom:16px;
  }
  .page-head::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 100% 100%,rgba(255,255,255,.12),transparent 60%);pointer-events:none;}
  .page-head .skew{position:absolute;right:-90px;top:-60px;width:300px;height:220px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0));transform:skewX(-18deg) rotate(6deg);border-radius:24px;pointer-events:none;}
  .page-head .dot{position:absolute;left:-40px;bottom:-40px;width:160px;height:160px;background:radial-gradient(closest-side,rgba(168,85,247,.4),transparent);pointer-events:none;}
  .page-head h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em;position:relative;}
  .page-head .sub{opacity:.85;font-size:12.5px;margin-top:2px;position:relative;}
  .page-head .actions{position:relative;display:flex;gap:8px;flex-shrink:0;}
  /* sidebar layout */
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  aside.sidebar{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid #e6e8f0;background:linear-gradient(180deg,#fafbff,#f5f6fb 60%);padding:18px 12px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;margin-bottom:6px;border-bottom:1px solid #eef0f6;text-decoration:none;color:inherit;}
  .brand-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#312e81,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 8px 18px -8px rgba(124,58,237,.55);}
  .nav-section{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.14em;padding:14px 10px 6px;display:flex;align-items:center;gap:6px;}
  .nav-section::after{content:"";flex:1;height:1px;background:#e6e8f0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;transition:background .12s,color .12s,transform .04s;text-decoration:none;position:relative;}
  .nav-item:hover{background:#eef0f7;color:#1e293b;}
  .nav-item.active{background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;box-shadow:0 6px 14px -6px rgba(67,56,202,.45);}
  .nav-item.active::before{content:"";position:absolute;left:-4px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(180deg,#a855f7,#06b6d4);}
  .nav-item .ico{width:20px;display:inline-flex;justify-content:center;font-size:14px;}
  .nav-item .cnt{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#eef0f7;color:#475569;}
  .nav-item.active .cnt{background:rgba(255,255,255,.22);color:#fff;}
  /* primary group: bolder, larger */
  .nav-item.primary{font-size:14px;font-weight:700;padding:11px 12px;}
  .nav-item.primary .ico{font-size:16px;}
  /* secondary group: smaller, muted */
  .nav-item.secondary{font-size:13px;font-weight:500;color:#64748b;padding:7px 11px;}
  .nav-item.secondary:hover{color:#1e293b;}
  .nav-item.secondary.active{color:#fff;font-weight:600;}
  .sidebar .foot{margin-top:auto;border-top:1px solid #eef0f6;padding-top:10px;display:flex;flex-direction:column;gap:6px;}
  .main{padding:22px 28px 56px;max-width:none;margin:0;width:100%;}
  .avatar{width:24px;height:24px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    aside.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid #e6e8f0;}
  }
  /* stats */
  .stat{padding:18px 20px;position:relative;overflow:hidden;border-radius:18px;background:#fff;border:1px solid #edeef5;box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -14px rgba(15,23,42,.08);}
  .stat .l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .stat .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-family:'Plus Jakarta Sans',sans-serif;}
  .stat .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .stat .band{height:4px;margin:14px -20px -18px;}
  /* collapsible */
  details.section{background:#fff;border:1px solid #edeef5;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 22px -14px rgba(15,23,42,.08);overflow:hidden;}
  details.section + details.section{margin-top:10px;}
  details.section > summary{
    list-style:none;cursor:pointer;padding:13px 18px 13px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    user-select:none;transition:background .12s;position:relative;
  }
  details.section > summary::-webkit-details-marker{display:none;}
  details.section > summary::marker{display:none;}
  details.section > summary::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,#a855f7,#06b6d4);opacity:.55;}
  details.section > summary:hover{background:#fafbff;}
  details.section > summary:hover::before{opacity:1;}
  details.section[open] > summary{border-bottom:1px solid #eef0f6;background:linear-gradient(180deg,#fafbff,#fff);}
  details.section[open] > summary::before{opacity:1;}
  details.section .head-l{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  details.section .head-l .title{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#0b1220;}
  details.section .head-l .sub{font-size:11.5px;color:#64748b;font-weight:500;letter-spacing:0;text-transform:none;margin-top:2px;}
  details.section .head-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  details.section .chev{width:26px;height:26px;border-radius:8px;background:#eef0f7;color:#475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;transition:transform .2s,background .15s;}
  details.section[open] > summary .chev{transform:rotate(90deg);background:#e0e7ff;color:#4338ca;}
  details.section > .body{padding:16px 18px 18px;}
  details.section > .body.flush{padding:0;}
  /* category bars */
  .catbar{width:5px;border-radius:5px;align-self:stretch;}
  .catbar-nutra{background:linear-gradient(180deg,#7c3aed,#a855f7);}
  .catbar-pcare{background:linear-gradient(180deg,#0284c7,#06b6d4);}
  .catbar-food{background:linear-gradient(180deg,#d97706,#f59e0b);}
  /* file upload */
  .file-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:#f1f3f9;border-radius:10px;font-size:12px;color:#334155;font-weight:600;border:1px dashed #cbd5e1;cursor:pointer;}
  .file-pill:hover{background:#eef0f7;border-color:#94a3b8;}
  .file-pill input{display:none;}
  .file-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#ecfdf5;color:#065f46;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid #a7f3d0;}
  /* link card row */
  .lcard{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #edeef5;border-radius:12px;padding:11px 13px;background:#fff;}
  .lcard:hover{border-color:#cdd2e1;background:#fafbff;}
  /* Sensory tables */
  .sensory-table td,.sensory-table th{vertical-align:top;padding:10px 12px;font-size:13px;}
  .sensory-table th{background:#f7f8fc;}
  .sensory-edit td,.sensory-edit th{vertical-align:top;padding:6px 8px;font-size:12px;}
  .sensory-edit input.input{padding:5px 8px;font-size:12px;}
  details.sensory-session{border:1px solid #ede9fe;border-radius:14px;overflow:hidden;background:#fff;}
  details.sensory-session summary{list-style:none;}
  details.sensory-session summary::-webkit-details-marker{display:none;}
  details.sensory-session+details.sensory-session{margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<datalist id="people-list"></datalist>
<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const h=(tag,attrs,...kids)=>{
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v===false||v==null)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat(Infinity)){
    if(k==null||k===false)continue;
    e.append(k.nodeType?k:document.createTextNode(String(k)));
  }
  return e;
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return '—';const x=new Date(d);if(isNaN(x))return d;return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
const fmtDT=d=>{if(!d)return '—';const x=new Date(d);return x.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const fmtSize=b=>!b?'':b<1024?b+'B':b<1024*1024?(b/1024).toFixed(1)+'KB':(b/1024/1024).toFixed(1)+'MB';
const toast=msg=>{const t=h('div',{class:'toast'},msg);document.getElementById('toast-root').append(t);setTimeout(()=>t.remove(),1800);};
const me=()=>localStorage.getItem('ih_user')||'User';
const projName=id=>(DB.projects.find(p=>p.id===id)||{}).name||'—';
const typeLabel=t=>({General:'New Project',Formulation:'Formulation',Packaging:'Packaging',FGPO:'FG PO Raised'})[t||'General']||'New Project';
/* Color-coded chip class for Type column. New Project=violet, Formulation=green, Packaging=amber, FG PO=red. */
const typeChipClass=t=>({General:'chip-violet',Formulation:'chip-green',Packaging:'chip-amber',FGPO:'chip-red'})[t||'General']||'chip-violet';
/* FG PO production timeline constants (after all RM+PM are connected) */
const FG_PROD_DAYS=10;     // production + QC
const FG_TRANSIT_DAYS=5;   // factory → warehouse
const FG_ERR_BUFFER_MAX=5; // worst-case error padding
/* Category styling — extend safely for Food. */
const CAT_LIST=['Nutra','Personal Care','Food'];
const catChipClass=c=>({'Nutra':'chip-violet','Personal Care':'chip-blue','Food':'chip-amber'})[c]||'chip-gray';
const catBarClass=c=>({'Nutra':'catbar-nutra','Personal Care':'catbar-pcare','Food':'catbar-food'})[c]||'catbar-nutra';
const catTint=c=>({'Nutra':'#f5f3ff','Personal Care':'#f0f9ff','Food':'#fffbeb'})[c]||'#f8fafc';

/* ============ data ============ */
const DB_KEY='innovation_hub_db_v6';
const LEGACY_KEYS=['innovation_hub_db_v5','innovation_hub_db_v4','innovation_hub_db_v3','innovation_hub_db_v2','innovation_hub_db'];
/* `materials` collection (v6) holds the FG-PO RM/PM rows. `notes` collection (v6) holds
   text-only notes that can live alongside files in the Documents section. */
const empty={projects:[],updates:[],formulations:[],ingredients:[],tasks:[],briefs:[],compSamples:[],ingOrders:[],packSamples:[],documents:[],notes:[],materials:[],sensorySessions:[],comments:[],changelog:[],settings:{people:[]}};
/* Defensive: every expected collection MUST be an array on the DB object before render touches it.
   Without this, a single null/undefined collection from the Sheet (e.g. documents:null) crashes the
   sidebar with "Cannot read properties of null (reading 'length')".  Keeps the app crash-proof. */
const COLLECTION_KEYS=['projects','updates','formulations','ingredients','tasks','briefs','compSamples','ingOrders','packSamples','documents','notes','materials','sensorySessions','comments','changelog'];
function normalizeDB(d){
  if(!d||typeof d!=='object')d={};
  COLLECTION_KEYS.forEach(k=>{ if(!Array.isArray(d[k]))d[k]=[]; });
  if(!d.settings||typeof d.settings!=='object')d.settings={people:[]};
  if(!Array.isArray(d.settings.people))d.settings.people=[];
  return d;
}
/* v6 migration: introduce `materials` collection for FG-PO RM/PM tracking, `notes` collection
   for standalone document-section notes, and add fgPOQty / fgPickedDate fields to projects.
   All additive — older data passes through unchanged. */
function migrateV5toV6(d){
  if(!d)return d;
  if(!Array.isArray(d.materials))d.materials=[];
  if(!Array.isArray(d.notes))d.notes=[];
  if(!Array.isArray(d.sensorySessions))d.sensorySessions=[];
  (d.projects||[]).forEach(p=>{
    if(p.fgPOQty===undefined)p.fgPOQty='';
    if(p.fgPickedDate===undefined)p.fgPickedDate='';
    if(p.partialRunOK===undefined)p.partialRunOK=false;
  });
  /* New in v6.2: each material gets a poQty field (quantity ordered in the PO).
     Older records without it default to '' (will be treated as 0 in calculations). */
  d.materials.forEach(m=>{
    if(m.poQty===undefined)m.poQty='';
    /* Drop the obsolete pickedForProduction flag — auto-computed now */
    if('pickedForProduction' in m)delete m.pickedForProduction;
  });
  return d;
}
/* v5 migration: fold legacy ingOrders into the unified ingredients collection (each ingredient gets an "ordered" flag with vendor/dates). Anything we can't map cleanly is left blank. */
function migrateV4toV5(d){
  if(!d)return d;
  // Ensure shape
  d.ingredients=d.ingredients||[];
  const legacyOrders=Array.isArray(d.ingOrders)?d.ingOrders.slice():[];
  legacyOrders.forEach(o=>{
    // Try to attach to an existing ingredient on the same project with a matching name (case-insensitive).
    const match=d.ingredients.find(i=>i.projectId===o.projectId&&(i.name||'').trim().toLowerCase()===(o.ingredientName||'').trim().toLowerCase());
    if(match){
      match.ordered=true;
      match.vendor=match.vendor||o.vendor||'';
      match.orderedDate=match.orderedDate||o.orderedDate||'';
      match.expectedDate=match.expectedDate||o.expectedDate||'';
      match.receivedDate=match.receivedDate||o.receivedDate||'';
    }else{
      // No matching ingredient — create a new ingredient record carrying the order details (evaluation status defaults to "Evaluating").
      d.ingredients.push({id:o.id||uid(),projectId:o.projectId,name:o.ingredientName||'(from order)',status:'Evaluating',notes:o.notes||'',ordered:true,vendor:o.vendor||'',orderedDate:o.orderedDate||'',expectedDate:o.expectedDate||'',receivedDate:o.receivedDate||'',createdAt:o.createdAt||new Date().toISOString()});
    }
  });
  // Default ordered=false on any ingredient that doesn't have the flag yet
  d.ingredients.forEach(i=>{if(i.ordered===undefined)i.ordered=false;});
  // Keep ingOrders array around (empty) for safe re-saves; nothing reads it anymore.
  d.ingOrders=[];
  // Briefs: ensure new lifecycle fields are present (verified, liveDate, projectId)
  (d.briefs||[]).forEach(b=>{if(b.verified===undefined)b.verified=false;});
  return d;
}
function load(){
  try{
    let raw=localStorage.getItem(DB_KEY);
    let migrated=false;
    if(!raw){
      // Look for any older version to migrate forward
      for(const k of LEGACY_KEYS){
        const old=localStorage.getItem(k);
        if(old){raw=old;migrated=true;console.log('[Innovation Hub] Migrating from '+k+' → '+DB_KEY);break;}
      }
    }
    let d=Object.assign({},empty,JSON.parse(raw||'{}'));
    d.settings=Object.assign({people:[]},d.settings||{});
    d=normalizeDB(d);
    d=migrateV4toV5(d);
    d=migrateV5toV6(d);
    if(migrated){localStorage.setItem(DB_KEY,JSON.stringify(d));}
    return d;
  }catch(e){
    console.error('load() failed',e);
    return {...empty,settings:{people:[]}};
  }
}
function save(db){try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){alert('Storage full. Export backup and delete some files.');}}
let DB=load();
const snap=o=>o?JSON.parse(JSON.stringify(o)):null;
function logChange(t,id,act,det='',extra){DB.changelog.unshift({id:uid(),entityType:t,entityId:id,action:act,details:det,user:me(),at:new Date().toISOString(),collection:(extra||{}).collection||null,before:(extra||{}).before||null});if(DB.changelog.length>500)DB.changelog.length=500;}
function commit(msg){save(DB);if(msg)toast(msg);schedulePush();render();}

/* ============ cloud sync ============
   Backend talks to Google Sheets (data) + Google Drive (file uploads) via a service account.
   Frontend only needs an API key (entered once in Settings).
   API_BASE is relative — same Vercel deployment serves both static + API. */
const API_BASE='/api';
let SYNC_STATE='idle';   // idle | syncing | error | offline
let SYNC_LAST=null;
let SYNC_TIMER=null;
const cloudCfg=()=>({secret:localStorage.getItem('ih_api_secret')||''});
const hasCloud=()=>!!cloudCfg().secret;
function setSyncState(s){SYNC_STATE=s;SYNC_LAST=new Date();updateSyncBadge();}
function updateSyncBadge(){const el=document.getElementById('sync-badge');if(!el)return;if(!hasCloud()){el.textContent='⚪ local only';el.title='No API key entered — open Settings to connect';return;}const map={idle:['🟢 synced','All changes saved to Google Sheet'],syncing:['🟡 syncing…','Pushing changes'],error:['🔴 sync error','Last push failed — open Settings to retry'],offline:['⚪ offline','No network']};const [t,tt]=map[SYNC_STATE]||map.idle;el.textContent=t;el.title=tt+(SYNC_LAST?(' · '+SYNC_LAST.toLocaleTimeString()):'');}
async function cloudPush(){
  if(!hasCloud())return;
  setSyncState('syncing');
  try{
    const res=await fetch(API_BASE+'/data',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-API-Secret':cloudCfg().secret},
      body:JSON.stringify({data:DB})
    });
    const j=await res.json();
    if(j.error)throw new Error(j.error);
    setSyncState('idle');
  }catch(e){setSyncState('error');console.error('cloudPush',e);}
}
async function cloudPull(){
  if(!hasCloud()){toast('Enter API key in Settings first');return false;}
  setSyncState('syncing');
  try{
    const res=await fetch(API_BASE+'/data',{headers:{'X-API-Secret':cloudCfg().secret}});
    const j=await res.json();
    if(j.error)throw new Error(j.error);
    DB=Object.assign({},empty,j);DB.settings=Object.assign({people:[]},DB.settings||{});
    DB=normalizeDB(DB);
    DB=migrateV4toV5(DB);
    DB=migrateV5toV6(DB);
    save(DB);setSyncState('idle');render();return true;
  }catch(e){setSyncState('error');console.error('cloudPull',e);toast('Pull failed: '+e.message);return false;}
}
function schedulePush(){if(!hasCloud())return;clearTimeout(SYNC_TIMER);SYNC_TIMER=setTimeout(cloudPush,1500);}
async function testCloud(){
  if(!hasCloud()){toast('Enter API key first');return;}
  try{
    const r=await fetch(API_BASE+'/data',{headers:{'X-API-Secret':cloudCfg().secret}});
    const j=await r.json();
    if(j.error){toast('Connected but auth failed: '+j.error);}
    else{toast('Connection OK ✓');}
  }catch(e){toast('Cannot reach API: '+e.message);}
}
// Auto-pull on load if we have an API key cached
(async()=>{if(hasCloud()){await cloudPull();}})();
function revertChange(c){
  if(!c.collection||!DB[c.collection]){toast('Cannot revert this entry');return;}
  const coll=DB[c.collection];
  const act=(c.action||'').toLowerCase();
  if(act==='created'){DB[c.collection]=coll.filter(x=>x.id!==c.entityId);logChange(c.entityType,c.entityId,'reverted creation',c.details||'',{collection:c.collection});commit('Reverted creation');return;}
  if(act==='deleted'){if(!c.before){toast('No snapshot to restore');return;}coll.unshift(c.before);logChange(c.entityType,c.entityId,'restored from delete',c.details||'',{collection:c.collection});commit('Restored');return;}
  // edit / status change: restore before
  if(!c.before){toast('No snapshot for this entry');return;}
  const idx=coll.findIndex(x=>x.id===c.entityId);
  if(idx>=0){coll[idx]=Object.assign({},c.before);}else{coll.unshift(c.before);}
  logChange(c.entityType,c.entityId,'reverted',c.details||'',{collection:c.collection});
  commit('Reverted');
}

/* A material is "delayed" when it's been ordered but not received and the expected
   date has passed. Used both in hubStats and the Overview "Material delays" section. */
function delayedMaterials(){
  return (DB.materials||[]).filter(m=>m.ordered&&!m.receivedDate&&m.expectedDate&&new Date(m.expectedDate)<new Date(today()));
}
function fgBlockerProjects(){
  /* FG PO projects where at least one material is a blocker (no PO + no pick) */
  return (DB.projects||[]).filter(p=>p.type==='FGPO').filter(p=>{
    const mats=(DB.materials||[]).filter(m=>m.projectId===p.id);
    if(!mats.length)return false;
    return mats.some(m=>!materialReadyDate(m));
  });
}

function docChip(d){
  // Local base64 file (offline / no-cloud upload)
  if(d.fileData)return h('a',{class:'file-chip',href:d.fileData,download:d.fileName||d.title,title:(d.description||'')+' · '+fmtSize(d.fileSize||0)},'📎 ',d.title||d.fileName,' ⬇');
  // Drive-hosted upload (has fileName + url)
  if(d.fileName&&d.url)return h('a',{class:'file-chip',href:d.url,target:'_blank',title:(d.description||'')+' · '+fmtSize(d.fileSize||0)+' · Drive'},'📎 ',d.title||d.fileName,' ↗');
  // Plain pasted URL
  if(d.url)return h('a',{class:'chip chip-blue',href:d.url,target:'_blank',title:d.description||''},'🔗 ',d.title,' ↗');
  return h('span',{class:'chip chip-gray',title:d.description||''},'📎 ',d.title);
}

/* Upload a file to Drive via our backend (/api/upload).  Returns {url, fileName, fileSize, fileType} on success, or null on failure. */
async function uploadFileToDrive(file){
  if(!hasCloud())return null;
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const r=await fetch(API_BASE+'/upload',{
          method:'POST',
          headers:{'Content-Type':'application/json','X-API-Secret':cloudCfg().secret},
          body:JSON.stringify({fileData:ev.target.result,fileName:file.name,fileType:file.type})
        });
        const j=await r.json();
        if(j.error){toast('Upload failed: '+j.error);res(null);return;}
        res({url:j.url,fileName:j.fileName,fileSize:j.fileSize,fileType:j.fileType});
      }catch(e){toast('Upload failed: '+e.message);res(null);}
    };
    reader.onerror=()=>{toast('Read failed');res(null);};
    reader.readAsDataURL(file);
  });
}

/* ----- Brief lifecycle helpers (pending → raised → verified → live) ----- */
const briefStage=b=>(b.status==='live'?'live':b.verified?'verified':b.status==='raised'?'raised':'pending');
function briefStageChip(b){
  const s=briefStage(b);
  const map={pending:['• Pending','chip-amber'],raised:['✓ Raised','chip-blue'],verified:['☑ Verified','chip-info'],live:['🚀 Live → Project','chip-green']};
  const [l,c]=map[s];
  return h('span',{class:'chip '+c},l);
}
function briefRow(b){
  const s=briefStage(b);
  const linkedProj=b.projectId&&DB.projects.find(p=>p.id===b.projectId);
  return h('tr',{},
    h('td',{},h('div',{class:'font-semibold'},b.title||'(untitled)'),h('div',{class:'text-xs text-slate-500'},b.description||'')),
    h('td',{},linkedProj?h('a',{class:'link',href:'#/project/'+linkedProj.id},linkedProj.name+' →'):h('span',{class:'text-xs text-slate-400'},'— (no project yet)')),
    h('td',{},briefStageChip(b)),
    h('td',{},b.raisedDate?fmtDate(b.raisedDate):'—'),
    h('td',{},s==='raised'||s==='verified'?h('a',{class:'link text-xs',href:'#/',onclick:e=>{e.preventDefault();HUB_TAB='projects';location.hash='#/';render();},title:'Verify & mark live happens in Projects → Incoming briefs'},'→ go to Projects'):s==='live'?h('span',{class:'text-xs text-slate-500'},'flowed ',fmtDate(b.liveDate)):h('span',{class:'text-xs text-slate-400'},'—')),
    h('td',{},briefActions(b))
  );
}
function briefActions(b){
  const s=briefStage(b);
  const out=[];
  if(s==='pending'){
    /* One-click raise — no prompt. The brief then appears in Projects → Incoming briefs for verification + mark-live. */
    out.push(h('button',{class:'btn btn-sm btn-primary',onclick:()=>{
      const before=snap(b);b.status='raised';b.raisedDate=today();b.raisedTo=null;
      logChange('brief',b.id,'raised',b.title||'',{collection:'briefs',before});commit('Marked raised — see Projects tab');
    }},'Mark raised'));
  }else if(s==='raised'||s==='verified'){
    out.push(h('a',{class:'btn btn-sm btn-ghost',href:'#/',onclick:e=>{e.preventDefault();HUB_TAB='projects';location.hash='#/';render();}},'Open in Projects →'));
  }else if(s==='live'){
    out.push(h('a',{class:'btn btn-sm btn-ghost',href:'#/project/'+b.projectId},'Open project →'));
  }
  out.push(' ',h('button',{class:'btn btn-sm btn-ghost',onclick:()=>openBriefModal(b)},'✎'));
  if(s!=='pending'){
    out.push(' ',h('button',{class:'btn btn-sm btn-ghost',title:'Roll back one stage',onclick:()=>{
      const before=snap(b);
      if(s==='live'){b.status='raised';b.verified=true;b.projectId=null;b.liveDate=null;b.liveBy=null;}
      else if(s==='verified'){b.verified=false;b.verifiedBy=null;b.verifiedDate=null;}
      else if(s==='raised'){b.status='pending';b.raisedDate=null;b.raisedTo=null;b.verified=false;}
      logChange('brief',b.id,'rolled back stage','→ '+briefStage(b),{collection:'briefs',before});commit('Rolled back');
    }},'↺'));
  }
  out.push(' ',h('button',{class:'btn btn-sm btn-danger',onclick:()=>confirmDialog('Delete brief?',()=>{const before=snap(b);DB.briefs=DB.briefs.filter(x=>x.id!==b.id);logChange('brief',b.id,'deleted',b.title||'',{collection:'briefs',before});commit('Deleted');})},'×'));
  return out;
}

/* ============ PROJECT PAGE ============ */
function viewProject(id){
  const p=DB.projects.find(x=>x.id===id);
  if(!p)return h('div',{class:'layout'},sidebar(),h('main',{class:'main'},h('div',{class:'card card-pad'},'Project not found. ',h('a',{class:'link',href:'#/'},'← Hub'))));
  const type=p.type||'General';
  const blocks=[pjHeader(p)];

  if(type==='FGPO'){
    /* FG PO projects show ONLY FG-PO blocks. No updates, tasks, docs/notes, comments, or change log. */
    blocks.push(pjFGPOHeader(p));
    blocks.push(pjFGMaterials(p,'RM'));
    blocks.push(pjFGMaterials(p,'PM'));
    blocks.push(pjFGETA(p));
    return h('div',{class:'layout'},sidebar(),h('main',{class:'main'},h('div',{class:'space-y-3'},...blocks)));
  }

  /* All other project types: full board */
  blocks.push(pjUpdates(p));
  blocks.push(pjTasks(p));
  if(type==='General'||type==='Formulation'){
    blocks.push(pjFormulations(p));
    blocks.push(pjIngredientsEval(p));
    blocks.push(pjCompSamples(p));
    blocks.push(pjSensory(p));
  }
  if(type==='General'||type==='Packaging'){
    blocks.push(pjPackSamples(p));
  }
  blocks.push(pjDocs(p));
  blocks.push(section({title:'💬 Comments',count:DB.comments.filter(c=>c.entityType==='project'&&c.entityId===p.id).length},commentsBlock('project',p.id)));
  blocks.push(section({title:'📜 Change log',sub:'Audit trail for this project'},changeLogBlock(c=>(c.entityType==='project'&&c.entityId===p.id)||(c.details||'').includes(p.name||''))));
  return h('div',{class:'layout'},sidebar(),h('main',{class:'main'},h('div',{class:'space-y-3'},...blocks)));
}

/* ============ FG PO project sections ============ */

/* Per-material ready date: when the full requirement is on hand or expected to land.
   Used by the FG ETA panel for both RM and PM (RM doesn't carry a ratio to FG, so we
   only need to know WHEN a material is sufficiently stocked, not how many FG it makes). */
function materialReadyDate(m){
  const stock=Number(m.currentStock||0);
  const poQty=m.ordered?Number(m.poQty||0):0;
  const need=Number(m.requiredQty||0);
  if(need>0&&stock>=need)return today();
  if(m.receivedDate)return m.receivedDate;
  if(m.ordered&&m.expectedDate&&(stock+poQty)>=need)return m.expectedDate;
  return null; // blocker: no PO, or PO doesn't cover the gap
}

/* === PM-only FG capacity. 1 PM unit per 1 FG unit assumed (scaled by ratio if requiredQty ≠ fgPOQty).
   Returns null if the data isn't enough (no requiredQty, no fgPOQty, or RM kind). */
function materialFGCapacityNow(p,m){
  if(m.kind!=='PM')return null;
  const stock=Number(m.currentStock||0);
  const need=Number(m.requiredQty||0);
  const fgTotal=Number(p.fgPOQty||0);
  if(!need||!fgTotal)return null;
  return Math.floor(stock*(fgTotal/need));
}
function materialFGCapacityFull(p,m){
  if(m.kind!=='PM')return null;
  const stock=Number(m.currentStock||0);
  const poQty=m.ordered?Number(m.poQty||0):0;
  const need=Number(m.requiredQty||0);
  const fgTotal=Number(p.fgPOQty||0);
  if(!need||!fgTotal)return null;
  return Math.floor((stock+poQty)*(fgTotal/need));
}
/* Project-level FG capacity = bottleneck PM. Returns {now, full, bottleneckName, bottleneckPM} or null. */
function projectFGBottleneck(p){
  const pms=DB.materials.filter(m=>m.projectId===p.id&&m.kind==='PM');
  if(!pms.length)return null;
  let bestNow=Infinity, bestFull=Infinity, bottleneckNow=null, bottleneckFull=null;
  pms.forEach(m=>{
    const cNow=materialFGCapacityNow(p,m);
    const cFull=materialFGCapacityFull(p,m);
    if(cNow!=null&&cNow<bestNow){bestNow=cNow;bottleneckNow=m;}
    if(cFull!=null&&cFull<bestFull){bestFull=cFull;bottleneckFull=m;}
  });
  if(bestNow===Infinity)return null;
  return {
    now:bestNow,full:bestFull===Infinity?bestNow:bestFull,
    bottleneckNow:bottleneckNow?(bottleneckNow.name||'(unnamed PM)'):null,
    bottleneckFull:bottleneckFull?(bottleneckFull.name||'(unnamed PM)'):null
  };
}
function addDays(dateStr,n){
  if(!dateStr)return '';
  const d=new Date(dateStr);if(isNaN(d))return '';
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

/* Big banner on top of the FG PO project page — shows target qty, FG ETA window. */
function pjFGPOHeader(p){
  const mats=DB.materials.filter(m=>m.projectId===p.id);
  const pms=mats.filter(m=>m.kind==='PM');
  const ready=mats.map(materialReadyDate).filter(Boolean);
  const blockers=mats.filter(m=>!materialReadyDate(m));
  const lastReady=ready.length?ready.sort().slice(-1)[0]:null;
  const fgTarget=Number(p.fgPOQty||0);
  const bn=projectFGBottleneck(p);
  const capNow=bn?Math.min(bn.now,fgTarget||bn.now):null;
  const capFull=bn?Math.min(bn.full,fgTarget||bn.full):null;
  const shortfallNow=(fgTarget&&capNow!=null)?(fgTarget-capNow):null;
  const shortfallFull=(fgTarget&&capFull!=null)?(fgTarget-capFull):null;
  /* Partial run mode: FG arrives ~today + production window (use current stock only).
     Full batch mode: FG arrives ~lastReady + production window. */
  const partialOn=!!p.partialRunOK;
  const arrivalAnchor=partialOn?today():lastReady;
  const fgBest=arrivalAnchor?addDays(arrivalAnchor,FG_PROD_DAYS+FG_TRANSIT_DAYS):null;
  const fgWorst=arrivalAnchor?addDays(arrivalAnchor,FG_PROD_DAYS+FG_TRANSIT_DAYS+FG_ERR_BUFFER_MAX):null;
  const arrivalLabel=partialOn?(capNow!=null?capNow.toLocaleString()+' FG (partial)':'partial'):(blockers.length?'🚫 unblock RM/PM':(capFull!=null?capFull.toLocaleString()+' FG':'full batch'));
  /* Equal-width grid keeps all 5 cards in a clean horizontal row */
  const cardCss='border-radius:14px;background:#fff;border:1px solid #edeef5;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px';
  const labelCss='font-size:10.5px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:700;line-height:1.3;margin-bottom:4px';
  const valueCss='font-size:24px;font-weight:800;font-family:Plus Jakarta Sans,sans-serif;letter-spacing:-.02em';
  const hintCss='font-size:11px;color:#64748b;margin-top:6px;line-height:1.35';
  const bandCss='height:3px;border-radius:3px;margin-top:8px';
  const card=(label,value,hint,bandGradient,valueColor)=>h('div',{style:cardCss},
    h('div',{style:labelCss},label),
    h('div',{style:valueCss+';color:'+(valueColor||'#0b1220')},value),
    hint?h('div',{style:hintCss},hint):h('div',{style:'flex:1'}),
    h('div',{style:bandCss+';background:'+bandGradient})
  );
  const grid=h('div',{style:'display:grid;grid-template-columns:repeat(5,1fr);gap:12px'},
    card('FG PO qty (target)',fgTarget?fgTarget.toLocaleString():'—',null,'linear-gradient(90deg,#e11d48,#f59e0b)'),
    card('Production NOW (PM stock only)',capNow!=null?capNow.toLocaleString()+' FG':'—',bn&&bn.bottleneckNow?'Bottleneck: '+bn.bottleneckNow:(pms.length?'set PM qtys':'no PM rows'),'linear-gradient(90deg,#d97706,#f59e0b)'),
    card('Production AFTER POs land',capFull!=null?capFull.toLocaleString()+' FG':'—',bn&&bn.bottleneckFull?'Bottleneck: '+bn.bottleneckFull:'set PM PO qtys','linear-gradient(90deg,#0284c7,#06b6d4)'),
    card('Shortfall vs target',shortfallFull==null?'—':shortfallFull>0?shortfallFull.toLocaleString()+' FG':'✓ met',shortfallFull>0?'Raise more PM PO or accept partial':' ','linear-gradient(90deg,'+(shortfallFull>0?'#e11d48,#f59e0b':'#059669,#10b981')+')',shortfallFull>0?'#e11d48':(shortfallFull===0?'#059669':'#0b1220')),
    card('FG warehouse arrival',fgBest?fmtDate(fgBest)+' → '+fmtDate(fgWorst):(blockers.length&&!partialOn?'🚫 unblock first':'set ready dates'),arrivalAnchor?(partialOn?'Partial run from stock · +'+FG_PROD_DAYS+'+'+FG_TRANSIT_DAYS+'+0–'+FG_ERR_BUFFER_MAX+' days':'Full batch · last material ready '+fmtDate(arrivalAnchor)):'','linear-gradient(90deg,#7c3aed,#06b6d4)')
  );
  /* Partial-run toggle bar */
  const partialBar=h('div',{class:'p-3 rounded-lg mt-3',style:'background:'+(partialOn?'#eef2ff':'#f8fafc')+';border:1px solid '+(partialOn?'#c7d2fe':'#e6e8f0')+';display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap'},
    h('label',{class:'flex items-center gap-2 cursor-pointer',style:'font-size:13px;font-weight:600'},
      h('input',{type:'checkbox',checked:partialOn,onchange:e=>{const before=snap(p);p.partialRunOK=e.target.checked;logChange('project',p.id,e.target.checked?'partial-run OK':'partial-run off',p.name||'',{collection:'projects',before});commit(e.target.checked?'Partial run mode on':'Full batch mode on');}}),
      h('span',{},'⚙️ OK to take a partial run with current PM stock?'),
      h('span',{style:'font-weight:400;color:#64748b'},partialOn?'(FG ETA uses today + production window)':'(FG ETA waits for all POs to land)')
    ),
    /* Order vs Got summary chips — what was ordered vs received per PM */
    pms.length?h('div',{style:'display:flex;flex-wrap:wrap;gap:6px;font-size:11px'},
      ...pms.map(m=>{const ord=Number(m.poQty||0),got=m.receivedDate?ord:0;return h('span',{class:'chip chip-gray',title:m.name||''},m.name||'?',': ordered ',ord.toLocaleString(),(m.receivedDate?' · got '+got.toLocaleString():' · pending'));})
    ):null
  );
  /* Partial run breakdown — only shown when toggle ON */
  const partialDetail=partialOn?h('div',{class:'p-3 rounded-lg mt-3',style:'background:#fefce8;border:1px solid #fde68a;font-size:13px;line-height:1.5'},
    h('div',{class:'font-bold mb-1'},'📦 Partial run scenario'),
    h('div',{},'Producing ',h('span',{class:'font-bold'},(capNow||0).toLocaleString()+' FG'),' from current PM stock. Short by ',h('span',{class:'font-bold text-rose-600'},(shortfallNow||0).toLocaleString()+' FG'),' against target of ',fgTarget.toLocaleString()+'.'),
    fgBest?h('div',{class:'mt-1'},'FG warehouse arrival: ',h('span',{class:'font-bold'},fmtDate(fgBest)+' → '+fmtDate(fgWorst))):null,
    h('div',{class:'text-xs text-slate-600 mt-1'},'Remaining ',(shortfallNow||0).toLocaleString(),' FG can be produced later if you raise additional PM POs.')
  ):null;
  return h('div',{class:'card card-pad'},
    h('div',{class:'sec-title mb-1'},'📦 FG PO summary'),
    h('div',{class:'text-xs text-slate-500 mb-3'},'PM bottleneck drives FG production (1 PM unit ≈ 1 FG unit). RM is tracked for delays but doesn\'t cap FG count.'),
    grid,
    partialBar,
    partialDetail,
    mats.length===0?h('div',{class:'empty mt-3'},'Add at least one RM or PM row to start tracking.'):null
  );
}

/* Section for one material kind (RM or PM). Renders an editable table. */
function pjFGMaterials(p,kind){
  const list=DB.materials.filter(m=>m.projectId===p.id&&m.kind===kind).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  /* Column layouts diverge slightly: PM rows show "PO qty" and "Supports FG"
     (1 PM ≈ 1 FG). RM rows omit those — RM ratios vary and aren't tracked here. */
  const isPm=kind==='PM';
  const headerCells=[h('th',{},kind+' name'),h('th',{},'Stock'),h('th',{},'Needed'),h('th',{},'Short')];
  if(isPm)headerCells.push(h('th',{},'PO qty'),h('th',{},'Supports FG'));
  headerCells.push(h('th',{},'Status'),h('th',{},'Vendor'),h('th',{},'Ordered'),h('th',{},'Expected'),h('th',{},'Received'),h('th',{},'Delay'),h('th',{},'Actions'));
  const body=list.length?h('div',{class:'scroll-x'},h('table',{},
    h('thead',{},h('tr',{},...headerCells)),
    h('tbody',{},...list.map(m=>{
      const stock=Number(m.currentStock||0);
      const need=Number(m.requiredQty||0);
      const short=Math.max(0,need-stock);
      const ordered=!!m.ordered;
      const received=!!m.receivedDate;
      const poQty=ordered?Number(m.poQty||0):0;
      const late=ordered&&!received&&m.expectedDate&&new Date(m.expectedDate)<new Date(today());
      const delay=late?Math.abs(daysBetween(m.expectedDate,today())):0;
      const statusChip=received?h('span',{class:'chip chip-green'},'✓ Received'):ordered?(late?h('span',{class:'chip chip-red'},'Delayed'):h('span',{class:'chip chip-blue'},'⏳ In transit')):h('span',{class:'chip chip-amber'},'• Not ordered');
      const supportsFG=isPm?materialFGCapacityFull(p,m):null;
      const cells=[
        h('td',{class:'font-semibold'},m.name||'(unnamed)',m.notes?h('div',{class:'text-xs text-slate-500 mt-0.5 whitespace-pre-wrap'},m.notes):null),
        h('td',{class:'text-xs'},stock||'—'),
        h('td',{class:'text-xs'},need||'—'),
        h('td',{class:'text-xs '+(short?'overdue':'')},short||'—'),
      ];
      if(isPm){
        cells.push(h('td',{class:'text-xs'},poQty?poQty.toLocaleString():'—'));
        cells.push(h('td',{class:'text-xs font-semibold'},supportsFG!=null?(Math.min(supportsFG,Number(p.fgPOQty||supportsFG)).toLocaleString()+' FG'):'—'));
      }
      cells.push(
        h('td',{},statusChip),
        h('td',{class:'text-xs'},ordered?h('div',{},m.vendor||'—',m.vendorContact?h('div',{class:'text-slate-400'},m.vendorContact):null):'—'),
        h('td',{class:'text-xs'},fmtDate(m.orderedDate)),
        h('td',{class:'text-xs'},fmtDate(m.expectedDate)),
        h('td',{class:'text-xs'},fmtDate(m.receivedDate)),
        h('td',{class:'text-xs '+(late?'overdue':'')},late?('+'+delay+'d'):'—'),
        h('td',{},
          h('button',{class:'btn btn-sm btn-ghost',onclick:()=>openMaterialModal(p,kind,m)},'✎'),' ',
          h('button',{class:'btn btn-sm btn-danger',onclick:()=>confirmDialog('Delete this '+kind+'?',()=>{const before=snap(m);DB.materials=DB.materials.filter(x=>x.id!==m.id);logChange('material',m.id,'deleted',m.name||'',{collection:'materials',before});commit('Deleted');})},'×')
        )
      );
      return h('tr',{},...cells);
    }))
  )):h('div',{class:'empty'},'No '+kind+' added yet — click "＋ Add '+kind+'" to start tracking.');
  const addBtn=h('button',{class:'btn btn-primary btn-sm',onclick:()=>openMaterialModal(p,kind)},'＋ Add '+kind);
  const label=kind==='RM'?'🌾 RM (raw materials)':'📦 PM (packaging materials)';
  const sub=kind==='RM'?'Each RM row: name, stock vs needed, vendor, dates, pick-for-production toggle.':'Each PM row: name, stock vs needed, vendor, dates, pick-for-production toggle.';
  return section({title:label,sub:sub,count:list.length,actions:[addBtn]},body);
}

/* Per-FG ETA timeline panel — shows what each material contributes to the worst-case date. */
function pjFGETA(p){
  const mats=DB.materials.filter(m=>m.projectId===p.id);
  if(!mats.length)return section({title:'⏱ FG arrival timeline',sub:'Will compute once you add RM/PM rows'},h('div',{class:'empty'},'Add at least one RM or PM row to see the FG arrival estimate.'));
  const rows=mats.slice().sort((a,b)=>(a.kind||'').localeCompare(b.kind)||(a.name||'').localeCompare(b.name||'')).map(m=>{
    const ready=materialReadyDate(m);
    const stock=Number(m.currentStock||0);
    const poQty=m.ordered?Number(m.poQty||0):0;
    const need=Number(m.requiredQty||0);
    let reason;
    if(need>0&&stock>=need)reason='stock covers required qty';
    else if(m.receivedDate)reason='already received';
    else if(m.ordered&&m.expectedDate&&(stock+poQty)>=need)reason='PO ETA (stock + PO qty covers gap)';
    else if(m.ordered&&m.expectedDate&&(stock+poQty)<need)reason='⚠ PO qty short by '+(need-stock-poQty)+' — raise more';
    else reason='BLOCKER — short on stock & no PO';
    return h('tr',{},
      h('td',{},h('span',{class:'chip '+(m.kind==='RM'?'chip-violet':'chip-blue')},m.kind)),
      h('td',{class:'font-semibold'},m.name||'(unnamed)'),
      h('td',{class:'text-xs '+(ready?'':'overdue')},ready?fmtDate(ready):'—'),
      h('td',{class:'text-xs text-slate-500'},reason)
    );
  });
  const ready=mats.map(materialReadyDate).filter(Boolean);
  const lastReady=ready.length?ready.sort().slice(-1)[0]:null;
  const allReady=ready.length===mats.length;
  const fgBest=allReady&&lastReady?addDays(lastReady,FG_PROD_DAYS+FG_TRANSIT_DAYS):null;
  const fgWorst=allReady&&lastReady?addDays(lastReady,FG_PROD_DAYS+FG_TRANSIT_DAYS+FG_ERR_BUFFER_MAX):null;
  const summary=h('div',{class:'p-3 rounded-lg',style:'background:'+(allReady?'#ecfdf5':'#fff7ed')+';border:1px solid '+(allReady?'#a7f3d0':'#fed7aa')},
    allReady
      ?h('div',{},h('div',{class:'font-bold text-sm'},'✅ All materials accounted for'),h('div',{class:'text-sm mt-1'},'Last material ready: '+h('span',{class:'font-semibold'},fmtDate(lastReady)).textContent+'. FG warehouse arrival: '+h('span',{class:'font-semibold'},fmtDate(fgBest)).textContent+' → '+h('span',{class:'font-semibold'},fmtDate(fgWorst)).textContent+'  ('+FG_PROD_DAYS+' prod+QC · '+FG_TRANSIT_DAYS+' transit · 0–'+FG_ERR_BUFFER_MAX+' error).'))
      :h('div',{},h('div',{class:'font-bold text-sm'},'⚠️ Blockers present'),h('div',{class:'text-sm mt-1'},'Resolve every blocker below (order it, or tick "Pick" to use current stock) before FG ETA can be estimated.'))
  );
  const table=h('div',{class:'scroll-x mt-3'},h('table',{},
    h('thead',{},h('tr',{},h('th',{},'Kind'),h('th',{},'Material'),h('th',{},'Ready date'),h('th',{},'Source'))),
    h('tbody',{},...rows)
  ));
  return section({title:'⏱ FG arrival timeline',sub:'Per-material ready date → FG warehouse window'},h('div',{},summary,table));
}

/* Modal for adding/editing a single RM or PM row on an FG PO project. */
function openMaterialModal(p,kind,existing){
  const isNew=!existing;
  const f=existing?{...existing}:{id:uid(),projectId:p.id,kind:kind,name:'',currentStock:'',requiredQty:'',ordered:false,poQty:'',vendor:'',vendorContact:'',orderedDate:'',expectedDate:'',receivedDate:'',notes:'',createdAt:new Date().toISOString()};
  /* Live-update DOM nodes (avoid full re-render so the input cursor stays alive). */
  const shortBox=h('div',{class:'input',style:'min-height:38px;background:#f8fafc'});
  const pmCapacityBox=h('div',{class:'p-3 rounded-lg',style:'background:#f1f5f9;border:1px solid #cbd5e1;font-size:13px;line-height:1.5'});
  const refreshSmart=()=>{
    const stock=Number(f.currentStock||0);
    const need=Number(f.requiredQty||0);
    const short=Math.max(0,need-stock);
    while(shortBox.firstChild)shortBox.firstChild.remove();
    shortBox.appendChild(short>0?h('span',{class:'text-rose-600 font-bold'},String(short)):h('span',{class:'text-emerald-700 font-bold'},'covered ✓'));
    /* PM-only capacity readout — RM has no fixed ratio to FG so we don't compute FG counts for it. */
    while(pmCapacityBox.firstChild)pmCapacityBox.firstChild.remove();
    if(f.kind!=='PM'){
      pmCapacityBox.style.background='#f1f5f9';pmCapacityBox.style.borderColor='#cbd5e1';
      pmCapacityBox.appendChild(h('div',{class:'text-slate-600 italic'},'RM consumption ratio varies — FG-unit calc lives at the project level, not per-RM.'));
      return;
    }
    const fgTotal=Number(p.fgPOQty||0);
    const poQty=f.ordered?Number(f.poQty||0):0;
    if(!need||!fgTotal){
      pmCapacityBox.style.background='#f1f5f9';pmCapacityBox.style.borderColor='#cbd5e1';
      pmCapacityBox.appendChild(h('div',{class:'text-slate-600'},'Set Required qty (this PM) and the project\'s FG PO qty to see PM → FG capacity.'));
      return;
    }
    const capNow=Math.floor(stock*(fgTotal/need));
    const capFull=Math.floor((stock+poQty)*(fgTotal/need));
    const capNowCapped=Math.min(capNow,fgTotal);
    const capFullCapped=Math.min(capFull,fgTotal);
    pmCapacityBox.style.background='#eef2ff';pmCapacityBox.style.borderColor='#c7d2fe';
    pmCapacityBox.appendChild(h('div',{class:'font-bold text-indigo-900'},'📦 PM → FG capacity (1 PM ≈ '+(need===fgTotal?'1 FG':((fgTotal/need).toFixed(2)+' FG'))+')'));
    pmCapacityBox.appendChild(h('div',{class:'mt-1'},'From current stock alone: ',h('span',{class:'font-bold'},capNowCapped.toLocaleString()+' / '+fgTotal.toLocaleString()+' FG units')));
    if(f.ordered){
      pmCapacityBox.appendChild(h('div',{},'After this PO ('+poQty.toLocaleString()+' '+kind+' units) lands: ',h('span',{class:'font-bold'},capFullCapped.toLocaleString()+' / '+fgTotal.toLocaleString()+' FG units'),capFull<fgTotal?h('span',{class:'text-rose-600 ml-1 font-semibold'},'(shortfall '+(fgTotal-capFullCapped).toLocaleString()+' FG)'):h('span',{class:'text-emerald-700 ml-1 font-semibold'},'(full target met)')));
    }else{
      pmCapacityBox.appendChild(h('div',{class:'text-amber-700'},'No PO raised yet for this PM — tick "PO already raised" and enter the PO qty to see full-batch capacity.'));
    }
  };
  /* PO details — toggled in/out on checkbox change.  Includes the new "PO qty raised" input. */
  const poDetailsHolder=h('div',{});
  const renderPoDetails=()=>{
    while(poDetailsHolder.firstChild)poDetailsHolder.firstChild.remove();
    if(!f.ordered)return;
    poDetailsHolder.appendChild(h('div',{class:'mt-3 space-y-3'},
      h('div',{class:'grid-3'},
        h('div',{},h('label',{class:'lbl'},'PO qty raised'),h('input',{class:'input',type:'number',min:'0',value:f.poQty||'',oninput:e=>{f.poQty=e.target.value;refreshSmart();},placeholder:'e.g. 5000'})),
        h('div',{},h('label',{class:'lbl'},'Vendor (optional)'),h('input',{class:'input',value:f.vendor||'',oninput:e=>{f.vendor=e.target.value;}})),
        h('div',{},h('label',{class:'lbl'},'Vendor contact (optional)'),h('input',{class:'input',value:f.vendorContact||'',oninput:e=>{f.vendorContact=e.target.value;},placeholder:'phone / email'}))
      ),
      h('div',{class:'grid-3'},
        h('div',{},h('label',{class:'lbl'},'Ordered on'),h('input',{class:'input',type:'date',value:f.orderedDate||'',onchange:e=>{f.orderedDate=e.target.value;refreshSmart();}})),
        h('div',{},h('label',{class:'lbl'},'Expected connection'),h('input',{class:'input',type:'date',value:f.expectedDate||'',onchange:e=>{f.expectedDate=e.target.value;refreshSmart();}})),
        h('div',{},h('label',{class:'lbl'},'Received on'),h('input',{class:'input',type:'date',value:f.receivedDate||'',onchange:e=>{f.receivedDate=e.target.value;refreshSmart();}}))
      )
    ));
  };

  const body=h('div',{class:'space-y-3'},
    h('div',{class:'grid-2'},
      h('div',{},h('label',{class:'lbl'},kind+' name (leave blank if not finalised yet)'),h('input',{class:'input',value:f.name,oninput:e=>{f.name=e.target.value;},placeholder:kind==='RM'?'e.g. Whey Protein 80%':'e.g. 250ml Amber HDPE bottle'})),
      h('div',{},h('label',{class:'lbl'},'Kind'),h('select',{class:'select',onchange:e=>{f.kind=e.target.value;refreshSmart();}},
        h('option',{value:'RM',selected:f.kind==='RM'?true:false},'RM — Raw material'),
        h('option',{value:'PM',selected:f.kind==='PM'?true:false},'PM — Packaging material')
      ))
    ),
    h('div',{class:'grid-3'},
      h('div',{},h('label',{class:'lbl'},'Current stock'),h('input',{class:'input',type:'number',min:'0',value:f.currentStock,oninput:e=>{f.currentStock=e.target.value;refreshSmart();}})),
      h('div',{},h('label',{class:'lbl'},'Required qty (for this batch)'),h('input',{class:'input',type:'number',min:'0',value:f.requiredQty,oninput:e=>{f.requiredQty=e.target.value;refreshSmart();}})),
      h('div',{},h('label',{class:'lbl'},'Short'),shortBox)
    ),
    pmCapacityBox,
    h('div',{class:'p-3 rounded-lg',style:'background:#f8fafc;border:1px solid #e6e8f0'},
      h('label',{class:'flex items-center gap-2 cursor-pointer'},
        h('input',{type:'checkbox',checked:!!f.ordered,onchange:e=>{f.ordered=e.target.checked;if(f.ordered&&!f.orderedDate)f.orderedDate=today();renderPoDetails();refreshSmart();}}),
        h('span',{class:'font-semibold text-sm'},'📋 PO already raised for this '+kind)
      ),
      poDetailsHolder
    ),
    h('div',{},h('label',{class:'lbl'},'Notes / comments'),h('textarea',{rows:2,oninput:e=>{f.notes=e.target.value;}},f.notes||''))
  );
  refreshSmart();
  renderPoDetails();
  openModal(isNew?'Add '+kind:'Edit '+kind,body,{footer:close=>[
    !isNew?h('button',{class:'btn btn-danger',onclick:()=>confirmDialog('Delete this '+kind+'?',()=>{const before=snap(existing);DB.materials=DB.materials.filter(x=>x.id!==existing.id);logChange('material',existing.id,'deleted',f.name||'',{collection:'materials',before});close();commit('Deleted');})},'Delete'):null,
    h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
    h('button',{class:'btn btn-primary',onclick:()=>{
      if(!f.name.trim())f.name='(unnamed '+kind+')';
      const before=existing?snap(existing):null;
      if(isNew){DB.materials.push(f);logChange('material',f.id,'created',f.name,{collection:'materials'});}else{Object.assign(existing,f);logChange('material',existing.id,'edited',f.name,{collection:'materials',before});}
      close();commit(isNew?(kind+' added'):'Saved');
    }},isNew?('Add '+kind):'Save')
  ]});
}

/* ============ Sensory data sessions (S1, S2, …) ============
   Available on type='General' and type='Formulation' projects. Each session is a
   {date, samples[], people[], ratings[{personName, sampleId, rating, comment}]} matrix. */
/* v6.1 sensory model:
   session = {
     id, projectId, sessionNo, name, date,
     samples: [{id, name}, …],
     people:  [name, name, …],
     parameters: ['Taste','Colour','Texture', …],   // user-defined ratable params
     cells: {                                       // key = personName + '|' + sampleId
        'PersonName|sample1': { 'Taste':7, 'Colour':8, _comment:'too sweet' }
     },
     createdAt
   }
   Avg (per cell), Overall (across params), Comment are reserved/special:
     - Comment lives in cells[key]._comment
     - Avg is computed (not stored) from numeric params
*/
const SENSORY_DEFAULT_PARAMS=['Taste','Colour','Texture'];
function ensureSensoryShape(sess){
  if(!sess.parameters)sess.parameters=SENSORY_DEFAULT_PARAMS.slice();
  if(!sess.cells)sess.cells={};
  /* Legacy migrate: old shape had `ratings: [{personName, sampleId, rating, comment}]` */
  if(Array.isArray(sess.ratings)&&sess.ratings.length){
    sess.ratings.forEach(r=>{
      const k=r.personName+'|'+r.sampleId;
      sess.cells[k]=sess.cells[k]||{};
      if(r.rating!==''&&r.rating!=null)sess.cells[k]['Overall']=Number(r.rating);
      if(r.comment)sess.cells[k]._comment=r.comment;
    });
    if(!sess.parameters.includes('Overall'))sess.parameters.push('Overall');
    delete sess.ratings;
  }
  return sess;
}
function sensoryCell(sess,personName,sampleId){
  const k=personName+'|'+sampleId;
  return sess.cells[k]||{};
}
function avgForCell(sess,personName,sampleId){
  const c=sensoryCell(sess,personName,sampleId);
  const vals=(sess.parameters||[]).map(p=>Number(c[p])).filter(v=>!isNaN(v)&&v!==0||v===0);
  /* drop NaNs (blank cells) */
  const nums=(sess.parameters||[]).map(p=>c[p]).filter(v=>v!==''&&v!=null&&!isNaN(Number(v))).map(Number);
  if(!nums.length)return null;
  return nums.reduce((s,n)=>s+n,0)/nums.length;
}
function avgForParamSample(sess,sampleId,paramName){
  const vals=(sess.people||[]).map(pn=>sensoryCell(sess,pn,sampleId)[paramName]).filter(v=>v!==''&&v!=null&&!isNaN(Number(v))).map(Number);
  if(!vals.length)return null;
  return vals.reduce((s,n)=>s+n,0)/vals.length;
}
function overallForSample(sess,sampleId){
  /* Average of per-cell averages (each person's overall for this sample), normalised across all raters who rated anything. */
  const perPerson=(sess.people||[]).map(pn=>avgForCell(sess,pn,sampleId)).filter(v=>v!==null);
  if(!perPerson.length)return null;
  return perPerson.reduce((s,n)=>s+n,0)/perPerson.length;
}
function rankedSamples(sess){
  return (sess.samples||[]).map(s=>({s,avg:overallForSample(sess,s.id)})).filter(x=>x.avg!==null).sort((a,b)=>b.avg-a.avg);
}
/* === Sensory analytics for the Insights panel ===
   Returns a structured object with the key takeaways from a single session. */
function sensoryInsights(sess){
  const samples=sess.samples||[],people=sess.people||[],params=sess.parameters||[];
  if(!samples.length||!people.length)return null;
  /* Winner / runner-up / loser */
  const ranks=rankedSamples(sess);
  /* Per-sample variance — standard deviation across raters' per-cell averages */
  const variance=samples.map(s=>{
    const ratings=people.map(pn=>avgForCell(sess,pn,s.id)).filter(v=>v!==null);
    if(ratings.length<2)return{sample:s,std:null};
    const mean=ratings.reduce((a,b)=>a+b,0)/ratings.length;
    const v=ratings.reduce((a,b)=>a+(b-mean)*(b-mean),0)/ratings.length;
    return{sample:s,std:Math.sqrt(v)};
  }).filter(x=>x.std!==null);
  const mostConsistent=variance.length?variance.reduce((a,b)=>a.std<b.std?a:b):null;
  const mostDivisive=variance.length?variance.reduce((a,b)=>a.std>b.std?a:b):null;
  /* Per-parameter performance across all samples */
  const paramScores=params.map(par=>{
    const vals=[];samples.forEach(s=>{const v=avgForParamSample(sess,s.id,par);if(v!=null)vals.push(v);});
    return{param:par,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
  }).filter(x=>x.avg!==null);
  const hotParam=paramScores.length?paramScores.reduce((a,b)=>a.avg>b.avg?a:b):null;
  const coldParam=paramScores.length?paramScores.reduce((a,b)=>a.avg<b.avg?a:b):null;
  /* Rater profile — who's generous, who's strict */
  const raterScores=people.map(pn=>{
    const rs=samples.map(s=>avgForCell(sess,pn,s.id)).filter(v=>v!==null);
    return{name:pn,avg:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,n:rs.length};
  }).filter(x=>x.avg!==null);
  const topFan=raterScores.length?raterScores.reduce((a,b)=>a.avg>b.avg?a:b):null;
  const topCritic=raterScores.length?raterScores.reduce((a,b)=>a.avg<b.avg?a:b):null;
  /* Overall participation */
  const totalCells=samples.length*people.length;
  const filled=samples.reduce((sum,s)=>sum+people.filter(pn=>avgForCell(sess,pn,s.id)!==null).length,0);
  return{ranks,mostConsistent,mostDivisive,hotParam,coldParam,topFan,topCritic,totalCells,filled,paramScores};
}

        /* Show rater tiles only when there are 2+ raters AND top fan ≠ top critic */

/* Full editor for one sensory session — manage samples, raters, parameters, and the cell grid.
   Only re-renders the GRID body when structure changes (add/remove a sample/rater/parameter).
   Typing into rating / comment cells mutates `f.cells` directly, so the input keeps focus. */
function openSensorySessionModal(p,sess){
  ensureSensoryShape(sess);
  const f=JSON.parse(JSON.stringify(sess));
  ensureSensoryShape(f);
  /* Holder that we re-fill when structure changes (samples/people/parameters changed) */
  const gridHolder=h('div',{});
  const setCell=(personName,sampleId,key,value)=>{
    const k=personName+'|'+sampleId;
    f.cells[k]=f.cells[k]||{};
    if(value===''||value==null){delete f.cells[k][key];}else{f.cells[k][key]=key==='_comment'?value:Number(value);}
  };
  const renderGrid=()=>{
    while(gridHolder.firstChild)gridHolder.firstChild.remove();
    /* IMPORTANT: render the grid even when one dimension is empty, so each
       "+ Sample" / "+ Rater" click is visible immediately. */
    if(!f.samples.length&&!f.people.length&&!f.parameters.length){
      gridHolder.appendChild(h('div',{class:'empty text-sm',style:'padding:24px;background:#faf5ff;border-radius:10px'},'Empty session — click ＋ Sample, ＋ Rater, ＋ Parameter to start.'));
      return;
    }
    const colsPerSample=f.parameters.length+1; // +1 for Comment (Avg is computed live)
    const head=h('thead',{},
      h('tr',{},
        h('th',{rowspan:'2',style:'background:#f5f3ff;position:sticky;left:0;z-index:2;min-width:170px;padding:12px'},'Person ↓ / Sample →'),
        ...f.samples.map((s,si)=>h('th',{colspan:String(colsPerSample+1),style:'background:#ede9fe;border-left:3px solid #c4b5fd;padding:10px'},
          h('div',{class:'flex items-center gap-2 justify-center'},
            h('input',{class:'input',style:'font-weight:700;flex:1;min-width:180px;background:#fff;font-size:14px;padding:8px 10px',value:s.name,oninput:e=>{s.name=e.target.value;}}),
            h('button',{class:'btn btn-sm btn-danger',title:'Remove sample',onclick:()=>{const sid=s.id;f.samples.splice(si,1);Object.keys(f.cells).forEach(k=>{if(k.endsWith('|'+sid))delete f.cells[k];});renderGrid();}},'×')
          )
        )),
        f.samples.length===0?h('th',{style:'background:#fef9c3;color:#92400e;font-style:italic;padding:14px'},'Click ＋ Sample to add a column'):null
      ),
      h('tr',{},
        ...f.samples.flatMap(s=>[
          ...f.parameters.map((par,pi)=>h('th',{style:'background:#f5f3ff;font-size:12px;border-left:3px solid #c4b5fd;padding:6px'},
            h('div',{class:'flex items-center gap-1'},
              h('input',{class:'input',style:'font-size:12px;padding:5px 6px;font-weight:700;min-width:90px',value:par,onchange:e=>{const nv=e.target.value.trim();if(!nv||f.parameters.includes(nv))return;Object.values(f.cells).forEach(c=>{if(par in c){c[nv]=c[par];delete c[par];}});f.parameters[pi]=nv;}}),
              h('button',{class:'btn btn-sm btn-danger',title:'Remove parameter',onclick:()=>{const removed=f.parameters.splice(pi,1)[0];Object.values(f.cells).forEach(c=>{delete c[removed];});renderGrid();}},'×')
            )
          )),
          h('th',{style:'background:#fef3c7;font-size:11px;min-width:140px;padding:6px'},'Comment'),
          h('th',{style:'background:#fde68a;font-size:11px;padding:6px'},'Avg')
        ])
      )
    );
    const liveAvgCell=(pn,sid)=>{
      const cell=h('td',{class:'text-center font-bold',style:'background:#fefce8;color:#a16207;font-size:16px;padding:8px'});
      const update=()=>{const v=avgForCell(f,pn,sid);cell.textContent=v===null?'—':v.toFixed(1);};
      update();cell._update=update;
      return cell;
    };
    const bodyRows=f.people.map((pn,pi)=>h('tr',{},
      h('td',{style:'background:#faf5ff;position:sticky;left:0;z-index:1;font-weight:700;min-width:170px;padding:8px'},
        h('div',{class:'flex items-center gap-1'},
          h('input',{class:'input',list:'people-list',style:'flex:1;font-weight:700;min-width:120px;font-size:13px;padding:7px 9px',value:pn,onchange:e=>{const nv=e.target.value.trim();if(!nv||f.people.includes(nv))return;Object.keys(f.cells).forEach(k=>{if(k.startsWith(pn+'|')){const nk=nv+k.slice(pn.length);f.cells[nk]=f.cells[k];delete f.cells[k];}});f.people[pi]=nv;}}),
          h('button',{class:'btn btn-sm btn-danger',title:'Remove rater',onclick:()=>{const removed=f.people.splice(pi,1)[0];Object.keys(f.cells).forEach(k=>{if(k.startsWith(removed+'|'))delete f.cells[k];});renderGrid();}},'×')
        )
      ),
      ...f.samples.flatMap(s=>{
        const c=f.cells[pn+'|'+s.id]||{};
        const avgCell=liveAvgCell(pn,s.id);
        return [
          ...f.parameters.map(par=>h('td',{style:'border-left:3px solid #ede9fe;padding:6px'},h('input',{class:'input',style:'padding:8px 10px;text-align:center;font-weight:700;font-size:15px;min-width:70px',type:'number',min:'1',max:'5',step:'0.5',placeholder:'1–5',value:c[par]!=null&&c[par]!==''?c[par]:'',oninput:e=>{setCell(pn,s.id,par,e.target.value);avgCell._update();}}))),
          h('td',{style:'background:#fffbeb;padding:6px'},h('input',{class:'input',style:'padding:6px 8px;font-size:12px;font-style:italic;min-width:140px',placeholder:'comment',value:c._comment||'',oninput:e=>setCell(pn,s.id,'_comment',e.target.value)})),
          avgCell
        ];
      })
    ));
    const emptyRowHint=f.people.length===0?h('tr',{},h('td',{colspan:String(1+f.samples.length*(colsPerSample+1)),style:'padding:24px;text-align:center;color:#92400e;background:#fef9c3;font-style:italic'},'Click ＋ Rater to add a row')):null;
    gridHolder.appendChild(h('div',{class:'scroll-x',style:'max-height:64vh;overflow:auto;border:1px solid #ede9fe;border-radius:10px'},h('table',{class:'sensory-edit',style:'min-width:100%'},head,h('tbody',{},...bodyRows,emptyRowHint))));
    if(f.parameters.length===0)gridHolder.appendChild(h('div',{class:'text-xs',style:'color:#92400e;background:#fef9c3;padding:8px 12px;border-radius:8px;margin-top:8px'},'⚠ No parameters yet — click ＋ Parameter to add Taste / Aroma / etc.'));
  };
  const addParamBtn=h('button',{class:'btn btn-ghost',onclick:()=>{const nm=prompt('Parameter name (e.g. Aroma, Mouthfeel):','');if(nm&&nm.trim()&&!f.parameters.includes(nm.trim())){f.parameters.push(nm.trim());renderGrid();}}},'＋ Parameter');
  const addSampleBtn=h('button',{class:'btn btn-ghost',onclick:()=>{f.samples.push({id:uid(),name:'Sample '+String.fromCharCode(65+f.samples.length)});renderGrid();}},'＋ Sample');
  const addRaterBtn=h('button',{class:'btn btn-ghost',onclick:()=>{const nm=prompt('Rater name (autocompletes from Settings → Team):','');if(nm&&nm.trim()&&!f.people.includes(nm.trim())){f.people.push(nm.trim());renderGrid();}}},'＋ Rater');
  const body=h('div',{class:'space-y-3'},
    h('div',{class:'grid-3'},
      h('div',{},h('label',{class:'lbl'},'Session label'),h('input',{class:'input',value:f.name,oninput:e=>f.name=e.target.value,placeholder:'S1, S2, R1, ...'})),
      h('div',{},h('label',{class:'lbl'},'Date'),h('input',{class:'input',type:'date',value:f.date,onchange:e=>f.date=e.target.value})),
      h('div',{class:'flex items-end gap-1 flex-wrap'},addSampleBtn,addRaterBtn,addParamBtn)
    ),
    h('div',{class:'text-xs text-slate-500'},'Rate 1–5 (5 = highest, half-points OK). Leave a cell blank to skip. Comments are optional per (rater, sample) cell. Avg column auto-computes across the numeric parameters for that cell.'),
    gridHolder
  );
  renderGrid();
  openModal('Edit sensory session — '+(f.name||'S'+f.sessionNo),body,{wide:true,footer:close=>[
    h('button',{class:'btn btn-danger',onclick:()=>confirmDialog('Delete this whole session?',()=>{const before=snap(sess);DB.sensorySessions=DB.sensorySessions.filter(x=>x.id!==sess.id);logChange('sensorySession',sess.id,'deleted',sess.name||'',{collection:'sensorySessions',before});close();commit('Deleted');})},'Delete'),
    h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
    h('button',{class:'btn btn-primary',onclick:()=>{
      /* Clean: drop completely-empty cells */
      Object.keys(f.cells).forEach(k=>{const c=f.cells[k];if(!Object.keys(c).length)delete f.cells[k];});
      const before=snap(sess);Object.assign(sess,f);logChange('sensorySession',sess.id,'edited',sess.name||'',{collection:'sensorySessions',before});
      close();commit('Session saved');
    }},'Save session')
  ]});
}

      h('div',{class:'text-xs text-slate-500'},d.description||''),

  ));

/* Standalone note modal — text + author (defaulted to current user) + timestamp. */
function openNoteModal(p,existing){

  const f=existing?{...existing}:{id:uid(),projectId:p.id,title:'',text:'',author:me(),at:new Date().toISOString()};
  const body=h('div',{class:'space-y-3'},

      h('div',{},h('label',{class:'lbl'},'Author'),h('input',{class:'input',list:'people-list',value:f.author,oninput:e=>f.author=e.target.value}))

        DB.documents=DB.documents.filter(d=>d.updateId!==rec.id||keep.has(d.id));
        f.docs.forEach(d=>{if(!d.title&&!d.url&&!d.fileData)return;const ex=DB.documents.find(x=>x.id===d.id);const rec2={title:d.title||d.fileName||'(untitled)',description:d.description||'',url:d.url||'',fileData:d.fileData||'',fileName:d.fileName||'',fileSize:d.fileSize||0,fileType:d.fileType||'',projectId:rec.projectId,updateId:rec.id,ingredientId:null,packSampleId:null,addedDate:today()};if(ex)Object.assign(ex,rec2);else DB.documents.push(Object.assign({id:d.id},rec2));});
        close();commit('Update saved');
      }},isNew?'Save update':'Save')
    ]});
  };
  re();
}

/* Meeting-mode batch update modal — log updates for multiple projects in one save.

  const entries=[{id:uid(),projectId:firstProjectIdHint||(DB.projects[0]||{}).id||'',date:today(),text:'',docs:[]}];

        )

        h('div',{class:'flex items-center justify-between'},
          h('div',{class:'flex items-center gap-2'},

            entries.length>1?h('button',{class:'btn btn-sm btn-danger',title:'Remove this entry',onclick:ev=>{ev.preventDefault();entries.splice(idx,1);re();}},'× Remove'):null
          ),
          h('div',{class:'text-xs text-slate-400'},'Author: ',me())
        ),
        h('div',{class:'grid-2'},
          h('div',{},h('label',{class:'lbl'},'Project'),h('select',{class:'select',onchange:ev=>{e.projectId=ev.target.value;}},h('option',{value:''},'Select project…'),...DB.projects.map(p=>h('option',{value:p.id,selected:e.projectId===p.id?true:false},p.name||'(untitled)')))),
          h('div',{},h('label',{class:'lbl'},'Date'),h('input',{class:'input',type:'date',value:e.date,onchange:ev=>{e.date=ev.target.value;}}))
        ),
        h('div',{},h('label',{class:'lbl'},'Update'),h('textarea',{rows:3,placeholder:'What was decided / blocked / shipped on this project…',oninput:ev=>{e.text=ev.target.value;}},e.text||'')),
        h('div',{},
          h('label',{class:'lbl flex items-center justify-between'},h('span',{},'Attach documents'),h('button',{class:'btn btn-sm btn-ghost',onclick:ev=>{ev.preventDefault();e.docs.push({id:uid(),title:'',url:'',description:'',fileData:'',fileName:'',fileSize:0,fileType:''});re();}},'＋ Add doc')),
          e.docs.length?h('div',{class:'space-y-2'},...e.docs.map((d,i)=>docInlineEditor(d,()=>{e.docs.splice(i,1);re();},re))):h('div',{class:'text-xs text-slate-400'},'No documents attached for this entry.')
        )
      )),
      h('div',{class:'flex justify-center'},
        h('button',{class:'btn btn-ghost',onclick:ev=>{ev.preventDefault();entries.push({id:uid(),projectId:(DB.projects[0]||{}).id||'',date:today(),text:'',docs:[]});re();}},'＋ Add another project update')
      )
    );
    openModal('Log update',body,{footer:close=>[
      h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
      h('button',{class:'btn btn-primary',onclick:()=>{
        const valid=entries.filter(e=>e.projectId&&(e.text.trim()||e.docs.length));
        if(!valid.length){toast('Add at least one entry with a project + update text');return;}
        valid.forEach(e=>{
          const rec={id:e.id,projectId:e.projectId,date:e.date,text:e.text,author:me(),createdAt:new Date().toISOString()};
          DB.updates.push(rec);
          logChange('update',rec.id,'created (batch)',projName(rec.projectId),{collection:'updates'});
          e.docs.forEach(d=>{if(!d.title&&!d.url&&!d.fileData)return;const rec2={id:d.id,title:d.title||d.fileName||'(untitled)',description:d.description||'',url:d.url||'',fileData:d.fileData||'',fileName:d.fileName||'',fileSize:d.fileSize||0,fileType:d.fileType||'',projectId:rec.projectId,updateId:rec.id,ingredientId:null,packSampleId:null,addedDate:today()};DB.documents.push(rec2);});
        });
        close();commit('Saved '+valid.length+' update'+(valid.length===1?'':'s'));
      }},'Save all ('+entries.length+')')
    ]});
  };
  re();
}

function docInlineEditor(d,onRemove,rerender){
  const cloudOn=hasCloud();
  const fileInput=h('input',{type:'file',onchange:async e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>50*1024*1024){alert('File is '+fmtSize(file.size)+' — over the 50 MB limit. Paste a Drive link instead.');return;}
    if(cloudOn){
      d.uploading=true;rerender();
      const up=await uploadFileToDrive(file);
      d.uploading=false;
      if(up){d.fileData='';d.url=up.url;d.fileName=up.fileName;d.fileSize=up.fileSize;d.fileType=up.fileType;if(!d.title)d.title=up.fileName;toast('Uploaded to Drive');}
      rerender();
    }else{
      if(file.size>3*1024*1024&&!confirm('File is '+fmtSize(file.size)+'. With no cloud configured, large files fill browser storage. Continue?'))return;
      const r=new FileReader();r.onload=ev=>{d.fileData=ev.target.result;d.fileName=file.name;d.fileSize=file.size;d.fileType=file.type;d.url='';if(!d.title)d.title=file.name;rerender();};r.readAsDataURL(file);
    }
  }});
  const hasFile=!!(d.fileData||(d.fileName&&d.url));
  const pill=h('label',{class:'file-pill'},'📂 ',d.uploading?'Uploading…':(hasFile?'Replace file':'Upload file'),fileInput);
  const chip=hasFile?h('span',{class:'file-chip'},'📎 ',d.fileName,' · ',fmtSize(d.fileSize),d.fileData?null:' · Drive',h('button',{class:'ml-1 font-bold',onclick:e=>{e.preventDefault();d.fileData='';d.fileName='';d.fileSize=0;d.fileType='';if(d.url&&d.url.includes('drive.google.com'))d.url='';rerender();}},'×')):null;
  return h('div',{class:'border border-slate-100 rounded-lg p-3 space-y-2'},
    h('div',{class:'grid-2'},
      h('input',{class:'input',placeholder:'Heading',value:d.title,oninput:e=>d.title=e.target.value}),
      h('input',{class:'input',placeholder:'About (optional)',value:d.description,oninput:e=>d.description=e.target.value})
    ),
    h('div',{class:'flex gap-2 items-center flex-wrap'},
      h('input',{class:'input',style:'flex:1;min-width:160px',placeholder:hasFile?'(file uploaded — paste link to replace)':'https://… (or upload)',value:hasFile&&d.fileName&&d.url?d.url:(hasFile?'':d.url),oninput:e=>d.url=e.target.value}),
      pill,
      chip,
      h('button',{class:'btn btn-danger btn-sm',onclick:e=>{e.preventDefault();onRemove();}},'×')
    )
  );
}

        h('label',{class:'lbl flex items-center justify-between'},h('span',{},'Documents'),h('button',{class:'btn btn-sm btn-ghost',onclick:e=>{e.preventDefault();f.docs.push({id:uid(),title:'',url:'',description:'',fileData:'',fileName:'',fileSize:0,fileType:''});re();}},'＋ Add')),
        f.docs.length?h('div',{class:'space-y-2'},...f.docs.map((d,i)=>docInlineEditor(d,()=>{f.docs.splice(i,1);re();},re))):h('div',{class:'text-xs text-slate-400'},'No documents.')
      )
    );
    openModal(isNew?'Add ingredient':'Edit ingredient',body,{footer:close=>[
      !isNew?h('button',{class:'btn btn-danger',onclick:()=>confirmDialog('Delete ingredient and its docs?',()=>{const before=snap(existing);DB.ingredients=DB.ingredients.filter(x=>x.id!==existing.id);DB.documents=DB.documents.filter(d=>d.ingredientId!==existing.id);logChange('ingredient',existing.id,'deleted',f.name||'',{collection:'ingredients',before});close();commit('Deleted');})},'Delete'):null,
      h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
      h('button',{class:'btn btn-primary',onclick:()=>{
        if(!f.name.trim())f.name='(untitled ingredient)';
        const rec={id:f.id,projectId:f.projectId,name:f.name,status:f.status,notes:f.notes,ordered:!!f.ordered,vendor:f.ordered?(f.vendor||''):'',orderedDate:f.ordered?(f.orderedDate||''):'',expectedDate:f.ordered?(f.expectedDate||''):'',receivedDate:f.ordered?(f.receivedDate||''):'',createdAt:f.createdAt};
        const before=existing?snap(existing):null;
        if(isNew)DB.ingredients.push(rec);else Object.assign(existing,rec);
        logChange('ingredient',rec.id,isNew?'created':'edited',rec.name,{collection:'ingredients',before});
        const keep=new Set(f.docs.map(d=>d.id));
        DB.documents=DB.documents.filter(d=>d.ingredientId!==rec.id||keep.has(d.id));
        f.docs.forEach(d=>{if(!d.title&&!d.url&&!d.fileData)return;const ex=DB.documents.find(x=>x.id===d.id);const r2={title:d.title||d.fileName||'(untitled)',description:d.description||'',url:d.url||'',fileData:d.fileData||'',fileName:d.fileName||'',fileSize:d.fileSize||0,fileType:d.fileType||'',projectId:p.id,ingredientId:rec.id,packSampleId:null,updateId:null,addedDate:today()};if(ex)Object.assign(ex,r2);else DB.documents.push(Object.assign({id:d.id},r2));});
        close();commit('Saved');
      }},'Save')
    ]});
  };
  re();
}

        f.docs.length?h('div',{class:'space-y-2'},...f.docs.map((d,i)=>docInlineEditor(d,()=>{f.docs.splice(i,1);re();},re))):h('div',{class:'text-xs text-slate-400'},'No documents.')

      h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
      h('button',{class:'btn btn-primary',onclick:()=>{
        const rec={id:f.id,projectId:f.projectId,packagingType:f.packagingType,colour:f.colour,size:f.size,cost:f.cost,moq:f.moq,notes:f.notes,createdAt:f.createdAt};
        if(isNew)DB.packSamples.push(rec);else Object.assign(existing,rec);
        logChange('packSample',rec.id,isNew?'created':'edited',rec.packagingType||'');

        DB.documents=DB.documents.filter(d=>d.packSampleId!==rec.id||keep.has(d.id));
        f.docs.forEach(d=>{if(!d.title&&!d.url&&!d.fileData)return;const ex=DB.documents.find(x=>x.id===d.id);const r2={title:d.title||d.fileName||'(untitled)',description:d.description||'',url:d.url||'',fileData:d.fileData||'',fileName:d.fileName||'',fileSize:d.fileSize||0,fileType:d.fileType||'',projectId:p.id,packSampleId:rec.id,ingredientId:null,updateId:null,addedDate:today()};if(ex)Object.assign(ex,r2);else DB.documents.push(Object.assign({id:d.id},r2));});

function openDocModal(d,defaults){
  const isNew=!d;d=d||{};
  const f={id:d.id||uid(),projectId:d.projectId||defaults?.projectId||(DB.projects[0]||{}).id||'',ingredientId:d.ingredientId||null,packSampleId:d.packSampleId||null,updateId:d.updateId||null,title:d.title||'',description:d.description||'',url:d.url||'',fileData:d.fileData||'',fileName:d.fileName||'',fileSize:d.fileSize||0,fileType:d.fileType||'',addedDate:d.addedDate||today()};
  const re=()=>{
    const cloudOn=hasCloud();
    const fileInput=h('input',{type:'file',onchange:async e=>{
      const file=e.target.files[0];if(!file)return;
      if(file.size>50*1024*1024){alert('File is '+fmtSize(file.size)+' — over the 50 MB limit. Paste a Drive link instead.');return;}
      if(cloudOn){
        f.uploading=true;re();
        const up=await uploadFileToDrive(file);
        f.uploading=false;
        if(up){f.fileData='';f.url=up.url;f.fileName=up.fileName;f.fileSize=up.fileSize;f.fileType=up.fileType;if(!f.title)f.title=up.fileName;toast('Uploaded to Drive');}
        re();
      }else{
        if(file.size>3*1024*1024&&!confirm('File is '+fmtSize(file.size)+'. With no cloud configured, large files fill browser storage. Continue?'))return;
        const r=new FileReader();r.onload=ev=>{f.fileData=ev.target.result;f.fileName=file.name;f.fileSize=file.size;f.fileType=file.type;f.url='';if(!f.title)f.title=file.name;re();};r.readAsDataURL(file);
      }
    }});
    const hasFile=!!(f.fileData||(f.fileName&&f.url));
    const pill=h('label',{class:'file-pill'},'📂 ',f.uploading?'Uploading…':(hasFile?'Replace file':'Choose file…'),fileInput);
    const body=h('div',{class:'space-y-3'},
      h('div',{},h('label',{class:'lbl'},'Project'),h('select',{class:'select',onchange:e=>f.projectId=e.target.value},h('option',{value:''},'—'),...DB.projects.map(p=>h('option',{value:p.id,selected:f.projectId===p.id?true:false},p.name||'(untitled)')))),
      h('div',{},h('label',{class:'lbl'},'Heading'),h('input',{class:'input',value:f.title,oninput:e=>f.title=e.target.value,placeholder:'e.g. Clinical study on biotin'})),
      h('div',{},h('label',{class:'lbl'},'About'),h('textarea',{rows:2,oninput:e=>f.description=e.target.value},f.description)),
      h('div',{},h('label',{class:'lbl'},'Link (paste URL)'),h('input',{class:'input',value:f.url,oninput:e=>f.url=e.target.value,placeholder:'https://…',disabled:hasFile&&f.fileData?true:false})),
      h('div',{},h('label',{class:'lbl'},cloudOn?'Or upload file → goes to your Drive folder':'Or upload file (any format)'),h('div',{class:'flex items-center gap-2 flex-wrap'},pill,hasFile?h('span',{class:'file-chip'},'📎 ',f.fileName,' · ',fmtSize(f.fileSize),f.fileData?null:' · Drive',h('button',{class:'ml-1 font-bold',onclick:e=>{e.preventDefault();f.fileData='';f.fileName='';f.fileSize=0;f.fileType='';if(f.url&&f.url.includes('drive.google.com'))f.url='';re();}},'×')):null))
    );
    openModal(isNew?'Add document':'Edit document',body,{footer:close=>[
      !isNew?h('button',{class:'btn btn-danger',onclick:()=>confirmDialog('Delete?',()=>{DB.documents=DB.documents.filter(x=>x.id!==d.id);logChange('document',d.id,'deleted',d.title||'');close();commit('Deleted');})},'Delete'):null,
      h('button',{class:'btn btn-ghost',onclick:close},'Cancel'),
      h('button',{class:'btn btn-primary',onclick:()=>{if(!f.title.trim()&&!f.fileName&&!f.url){close();return;}if(!f.title.trim())f.title=f.fileName||'(untitled doc)';if(isNew){DB.documents.push(f);logChange('document',f.id,'created',f.title);}else{Object.assign(d,f);logChange('document',d.id,'edited',f.title);}close();commit('Saved');}},'Save')
    ]});
  };
  re();
}

render();
</script>
